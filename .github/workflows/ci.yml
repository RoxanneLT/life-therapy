# .github/workflows/ci.yml — runs the SAME gate the git hooks run.
#
# This job used to run `npm run lint` and `npx tsc --noEmit`: two of the ten steps in
# `npm run check`. Everything else — the architecture audit, the planted-violation probes, the four
# gate suites, the import-cycle check, knip, the budget probes — ran on one laptop and in no
# workflow. A control that runs nowhere automatic is a control whose failure is discovered by
# whoever happens to type the command, which for a solo project can be weeks.
#
# The point is that CI and the hooks run the IDENTICAL command. A CI job that runs a subset teaches
# people that green-in-CI means checked, and it is the more visible of the two signals.
#
# WHAT THIS JOB DELIBERATELY DOES NOT DO:
#   - no `next build`. Vercel builds every push to master and every PR preview, and that is the
#     authoritative build signal. Duplicating it here would need real Supabase credentials, because
#     several pages prerender against live data.
#   - no database. That is the separate `db-tests` job below (since 2026-10-09), against a
#     throwaway Postgres built from prisma/sql/. Nothing in either job talks to production.
#
# NOTES ON THINGS THAT WOULD OTHERWISE BITE, each verified before this job was widened:
#   - `npm ci` runs `prepare`, which sets `core.hooksPath` — so `check-git-hooks.mjs` finds the
#     wiring it asserts. Without that, the ONE probe that cannot pass in a fresh checkout would be
#     the one guarding the whole tier.
#   - the checkout is SHALLOW (`actions/checkout` defaults to depth 1). Nothing in the chain reads
#     git history, so that is fine here — but it is why the sibling project's pre-push composition
#     probe was not ported: it derives fixtures from `<sha>~1` and crashes on a shallow clone.
#   - the runner is UTC and this business runs SAST (UTC+2). The unit suite was run under `TZ=UTC`
#     before this landed: 228/228. If a date test ever goes red here and green locally, that is a
#     real finding about the code, not about the runner — see CLAUDE.md §9.
#   - no `.env` file exists here, by design. `prisma generate` does not need one, and every test
#     that touches `process.env` sets and restores its own values.

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  check:
    name: npm run check
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `postinstall` runs `prisma generate` and `prepare` wires core.hooksPath.
      - name: Install dependencies
        run: npm ci

      # Belt and braces: `tsc` cannot resolve lib/generated/prisma without it, and a failure here
      # is far easier to read than the hundred type errors it would otherwise cause.
      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run the gate
        run: npm run check

  db-tests:
    name: DB tier (test:db)
    # No `needs:` — it shares nothing with `check`, so it runs beside it and adds nothing to the
    # wait. A red `check` still blocks the merge on its own.
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Plain Postgres, not a Supabase stack: Supabase here is auth only, and every query goes through
    # Prisma. 17 because production is 17.x. The password is this container's and nothing else's.
    # There is NO production credential in this job, and scripts/db-test.mjs refuses any non-local
    # host even if one were added.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Builds a fresh database from prisma/sql/ (the files production runs), then runs every
      # *.dbtest.ts against it.
      - name: Run the DB tier
        run: npm run test:db
        env:
          LT_TEST_DATABASE_URL: postgresql://postgres:ci-only@localhost:5432/postgres
